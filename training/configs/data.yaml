# =============================================================================
# training/configs/data.yaml — data sources, paths, and dataset-building settings
# =============================================================================
#
# Description:
#   Single source of data settings for every data-handling script. No script
#   hard-codes paths, versions, or window sizes (agents.md → Training code).
#
# Phases: 1 (acquisition), 2 (chunk derivation), 3 (alignment), 4 (dataset).
#
# Tasks:
#   1. Phase 1: record UD English EWT release tag, commit hash, and SHA-256
#      checksums of each .conllu file after fetch_data.sh runs.
#   2. Phase 1: record GUM decision and allowed subcorpora (if any).
#   3. Phase 4: set window and label settings used by prepare_data.py.
#
# Dependencies:
#   Read by: scripts/fetch_data.sh, scripts/derive_chunks.py,
#            scripts/prepare_data.py, scripts/evaluate.py,
#            js/align_tokens.mjs, js/evaluate_baselines.mjs.
#
# Planned keys (values to be filled per phase; none set yet):
#   ud_ewt:
#     repo_url            — UD_English-EWT git URL
#     release_tag         — pinned UD release tag (Phase 1)
#     commit              — commit hash of the tag (Phase 1)
#     checksums           — {train,dev,test}.conllu SHA-256 (Phase 1)
#   gum:
#     enabled             — bool; default false until Phase 1 decision
#     subcorpora          — list of license-compatible subcorpora
#   paths (all under training/data/, git-ignored) (proposed):
#     raw                 — data/raw/
#     chunked             — data/processed/chunked/   (derive_chunks.py output)
#     aligned             — data/processed/aligned/   (align_tokens.mjs output)
#     dataset             — data/processed/dataset/   (prepare_data.py output)
#     labels              — data/processed/labels.json
#     checkpoints         — data/checkpoints/
#     runs                — data/runs/                (TensorBoard logs)
#     onnx                — data/onnx/                (export_onnx.py output)
#   windows:
#     max_subword_tokens  — 256 (same as runtime window)
#     long_sentence_overlap — 32
#   labels:
#     min_label_count     — 5 (rarer UPOS|CHUNK combos mapped to nearest valid)
#   augmentation:
#     enabled             — bool (Phase 4 task 5; kept only if dev F1 holds)
#     max_fraction        — 0.15 of train windows
#     kinds               — lowercase_sentence_start, drop_final_punct, learner_typos
#   seed                  — global data seed
#
# Status: Phase 1–4 keys set; later keys added per phase.
# =============================================================================

# Phase 1 — UD English EWT (CC BY-SA 4.0). commit/checksums: null until the
# first fetch_data.sh run prints them; later runs fail on mismatch.
# Pinned 2026-11-18 (latest UD release).
ud_ewt:
  repo_url: https://github.com/UniversalDependencies/UD_English-EWT.git
  release_tag: r2.19
  commit: 6b021622f3ab7902730f313fa5955a8b8cdd52b8
  dir: ud_ewt
  files:
    train: en_ewt-ud-train.conllu
    dev: en_ewt-ud-dev.conllu
    test: en_ewt-ud-test.conllu
    license: LICENSE.txt
  checksums:
    train: fa6b2c9fc048273ee52f9609bcdc5880df366b6b72847e01a353259ea78c2a37
    dev: ebd876f58675824910a380e1c28145739856a0d595fc44851d577d0e7047f356
    test: 5b5df91ca23677345b941dc58d81617753e0d2d8bee12094e2a25cead3c18973
    license: b3d1b0f4c6ae151f7eb78738f46ebd5ee140f8a7f76501ba26af123140d35ae7

# Phase 1 — GUM excluded: the UD release (r2.19) is licensed CC BY-NC-SA 4.0
# as a whole; non-commercial data is not allowed (agents.md → Dependency
# policy). Owner decision, 2026-11-18.
gum:
  enabled: false
  subcorpora: []

# All paths are relative to training/ and git-ignored.
paths:
  raw: data/raw
  chunked: data/processed/chunked
  aligned: data/processed/aligned
  dataset: data/processed/dataset   # <model_key>/ = save_to_disk dataset + labels.json
  dataset_arc: data/processed/dataset_arc          # biaffine head (prepare_data.py --encoding arc; schema v2)
  dataset_arc_aug: data/processed/dataset_arc_aug  # same, train split augmented (--augment)
  checkpoints: data/checkpoints     # <model_key>/<run>/best (+ summary.json, tensorboard/)
  onnx: data/onnx                   # <model_key>/<run>/ (export_onnx.py)
  eval: data/eval                   # <model_key>/<run>/<split>_{metrics,predictions,nested}.* (evaluate.py)
  logs: data/logs                   # run logs and Phase 7 status (run_phase7.py)

# Phase 2 — chunk derivation (scripts/derive_chunks.py).
chunks:
  splits: [train, dev, test]
  report: reports/chunks.md
  review:
    sentences: 200
    seed: 13
    sample_path: data/processed/review/chunk_review_sample.md

# Phase 3 — alignment with runtime words (js/align_tokens.mjs).
alignment:
  splits: [train, dev, test]
  report: reports/alignment.md
  min_agreement: 0.995   # per split (plan-training.md → Phase 3 → Decisions)
  report_examples: 6     # examples per mismatch type in the report

# Phase 4 — dataset building (scripts/prepare_data.py).
windows:
  max_subword_tokens: 256      # incl. special tokens; same as runtime windows
  long_sentence_overlap: 32    # subword tokens repeated when a sentence is split
  max_subwords_per_word: 16    # longer words (URLs, symbol runs) keep their first 16 subwords; runtime too
labels:
  min_label_count: 5           # rarer labels (train, reviewed words) are merged
  dep_encoding: rel_pos_v1     # schema v1; --encoding arc writes the biaffine datasets (schema v2)
  # Relation subtypes kept by the biaffine relation classifier (owner, 2026-11-19; T03); others fold to base.
  relation_subtypes: [nsubj:pass, aux:pass, obl:agent, acl:relcl, nmod:poss, compound:prt, obl:unmarked, det:predet, advcl:relcl, cc:preconj]
augmentation:                  # Phase 7 biaffine experiment (owner, 2026-11-20); train split only
  enabled: false               # prepare_data.py --augment turns it on for dataset_arc_aug
  max_fraction: 0.15
  kinds: [lowercase_sentence_start, drop_final_punct]   # learner_typos: out of v1 (owner, 2026-11-20)
dataset:
  splits: [train, dev, test]
  report: reports/dataset.md
  report_arc: reports/dataset_arc.md
seed: 13

# Phase 5 — baselines (js/evaluate_baselines.mjs).
baselines:
  splits: [dev, test]
  report: reports/baselines.md
  top_confusions: 8
