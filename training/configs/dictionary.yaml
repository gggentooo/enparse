    license: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Open English WordNet 2025 (https://en-word.net/), by John P. McCrae and the Open English WordNet contributors, based on Princeton WordNet 3.0, is licensed under CC BY 4.0."

  wiktionary:
    name: English Wiktionary, via the kaikki.org English extract (wiktextract)
    url: https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz
    file: data/raw/dictionary/kaikki.org-dictionary-English.jsonl.gz
    sha256: 4d03b6cba283744756c57ff661c2c6cbfe34fcf8ff513a966576cf7d97e91a99
    downloaded: "2026-11-23"
    last_modified: "Fri, 30 Oct 2026 23:09:26 GMT"
    subset:
      file: data/raw/dictionary/wiktionary-subset.jsonl.gz
      sha256: 516cc6c2c96a30db0694d6d08df9345188f74e835a8c2b1824a4c9b8e25a27ea
    license: CC BY-SA 4.0
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
