# =============================================================================
# training/configs/train_modernbert_base.yaml — hyperparameters for
# answerdotai/ModernBERT-base (Apache 2.0, ~150M params, ~150 MB int8;
# accuracy upper bound)
# =============================================================================
#
# Description:
#   Per-candidate training config read by scripts/train.py. Same key set as
#   every other train_<model>.yaml so candidates are compared on equal terms.
#
# Phases: 0 (environment check), 4 (dataset), 7 (smoke test, full training), 8–11.
#
# Tasks:
#   1. Phase 0: `framework` set from check_env.py (hf_trainer).
#   2. Phase 7: smoke test (1 epoch, export check), then the full training below.
#      Every candidate is trained; it is offered in the app if it meets the
#      acceptance thresholds (no single base model is selected).
#   3. Confirm Transformers.js and Optimum export support during the Phase 7 smoke test.
#
# Dependencies:
#   Read by: scripts/train.py, scripts/check_env.py, scripts/calibrate.py,
#            scripts/export_onnx.py, scripts/evaluate.py.
#   Uses paths and dataset from: configs/data.yaml.
#
# Planned keys (values from plan-training.md → Phase 7; none set yet):
#   model_name            — answerdotai/ModernBERT-base
#   framework             — hf_trainer (Phase 0 outcome)
#   head                  — two label groups in one classifier (A: UPOS|CHUNK, B: rel_pos_v1)
#   dep_loss_weight       — λ = 1.0 (sweep 0.5, 1.0, 2.0)
#   learning_rate         — 5e-5
#   lr_schedule           — linear, warmup_ratio 0.1
#   batch_size            — 32 windows (grad accumulation if needed)
#   epochs                — up to 10
#   early_stopping        — metric dev chunk F1, patience 2
#   weight_decay          — 0.01
#   max_seq_length        — 256
#   precision             — fp32
#   seeds                 — 3 for the final configuration
#   output_subdir         — checkpoint subfolder under data/checkpoints/
#
# Status: Phase 0 and Phase 7 keys set.
# =============================================================================

model_name: answerdotai/ModernBERT-base
framework: hf_trainer  # Phase 0 result (check_env.py, 2026-11-18); Unsloth unsupported on MPS
max_seq_length: 256
tokenizer_kwargs: {add_prefix_space: true}  # BPE needs it for pre-split words (Phase 4)

# Phase 7 training settings (plan-training.md → Phase 7 → Starting hyperparameters).
learning_rate: 5.0e-5
lr_sweep: [2.0e-5, 3.0e-5, 5.0e-5, 1.0e-4]
lr_schedule: linear
warmup_ratio: 0.1
batch_size: 32
grad_accum_steps: 1
epochs: 10
early_stopping_patience: 2
weight_decay: 0.01
precision: fp32
dep_loss_weight: 1.0
dep_loss_weight_sweep: [0.5, 1.0, 2.0]
seeds: [13, 42, 2026]
